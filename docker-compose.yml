# Local Phase 5 agent — API stays on the host (npm run dev).
# Usage:
#   export REVENANT_RUNNER_TOKEN=rvn_...
#   docker compose up --build

services:
  agent:
    build:
      context: .
      additional_contexts:
        cli-src: ../revenant-cli
      args:
        REVENANT_API_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REVENANT_API_URL: http://host.docker.internal:8080
      REVENANT_RUNNER_TOKEN: ${REVENANT_RUNNER_TOKEN:?set REVENANT_RUNNER_TOKEN}
      REVENANT_POLL_MS: "3000"
    restart: unless-stopped
